<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Calculator - Tool Mitra</title>
<meta name="description" content="Free online simple calculator for addition, subtraction, multiplication and division.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#070b14;
  color:#fff;
  min-height:100vh;
}

header{
  padding:18px;
  text-align:center;
  border-bottom:1px solid #20283a;
}

header a{
  color:#00eaff;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:420px;
  margin:40px auto;
  padding:20px;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#9ba7ba;
  text-decoration:none;
}

.card{
  background:#101827;
  border:1px solid #263247;
  border-radius:20px;
  padding:22px;
  box-shadow:0 0 30px rgba(0,234,255,.08);
}

h1{
  text-align:center;
  color:#00eaff;
  margin-bottom:20px;
}

.display{
  width:100%;
  height:70px;
  background:#080d18;
  border:1px solid #34415a;
  border-radius:12px;
  color:#fff;
  font-size:30px;
  text-align:right;
  padding:10px 15px;
  margin-bottom:18px;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

button{
  height:60px;
  border:none;
  border-radius:12px;
  background:#1b2638;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

button:hover{
  background:#26364e;
}

.operator{
  color:#00eaff;
}

.equal{
  background:#00eaff;
  color:#001018;
}

.clear{
  color:#ff6b81;
}

.zero{
  grid-column:span 2;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#667085;
}
</style>
</head>

<body>

<header>
  <a href="index.html">⚡ Tool Mitra</a>
</header>

<div class="container">

<a href="tools.html" class="back">← Back to All Tools</a>

<div class="card">

<h1>Simple Calculator</h1>

<input type="text" id="display" class="display" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">⌫</button>
<button class="operator" onclick="appendValue('%')">%</button>
<button class="operator" onclick="appendValue('/')">÷</button>

<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('*')">×</button>

<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="operator" onclick="appendValue('-')">−</button>

<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button class="operator" onclick="appendValue('+')">+</button>

<button class="zero" onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>
</div>
</div>

<footer>
© 2026 Tool Mitra
</footer>

<script>
let display = document.getElementById("display");

function appendValue(value){

  if(display.value === "0" && !isNaN(value)){
    display.value = value;
  }else{
    display.value += value;
  }
}

function clearDisplay(){
  display.value = "0";
}

function deleteLast(){
  if(display.value.length > 1){
    display.value = display.value.slice(0,-1);
  }else{
    display.value = "0";
  }
}

function calculate(){

  try{

    let expression = display.value;

    if(!/^[0-9+\-*/%.() ]+$/.test(expression)){
      throw new Error();
    }

    let result = Function('"use strict"; return (' + expression + ')')();

    if(!isFinite(result)){
      throw new Error();
    }

    display.value = result;

  }catch{
    display.value = "Error";
  }
}
</script>

</body>
</html>
