<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Mitra - Free Online Tools</title>

  <meta name="google-site-verification" content="B_rKASsSlFEPX1Rjjr26ArwViGio5dvktBQywiVSlrs" />
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#222}
header{background:#111827;color:white;text-align:center;padding:25px 15px}
header h1{margin:0;font-size:32px}
header p{color:#d1d5db}
.container{max-width:750px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;margin-bottom:20px;border-radius:15px;box-shadow:0 4px 15px #00000012}
h2{text-align:center}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;margin-top:16px;background:#111827;color:white;border:0;border-radius:8px;font-size:16px}
.result{margin-top:15px;padding:13px;background:#f0fdf4;border-radius:8px;text-align:center;font-weight:bold}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>

<body>

<header>
<h1>Tool Mitra</h1>
<p>Free & Simple Online Tools</p>
</header>

<div class="container">

<div class="card">
<h2>Percentage Calculator</h2>
<label>Percentage (%)</label>
<input id="percent" type="number">
<label>Number</label>
<input id="percentNum" type="number">
<button onclick="percentage()">Calculate</button>
<div class="result" id="percentResult"></div>
</div>

<div class="card">
<h2>Age Calculator</h2>
<label>Date of Birth</label>
<input id="dob" type="date">
<button onclick="age()">Calculate Age</button>
<div class="result" id="ageResult"></div>
</div>

<div class="card">
<h2>BMI Calculator</h2>
<label>Height (cm)</label>
<input id="height" type="number">
<label>Weight (kg)</label>
<input id="weight" type="number">
<button onclick="bmi()">Calculate BMI</button>
<div class="result" id="bmiResult"></div>
</div>

<div class="card">
<h2>GST Calculator</h2>
<label>Amount (₹)</label>
<input id="gstAmount" type="number">
<label>GST (%)</label>
<input id="gstRate" type="number">
<button onclick="gst()">Calculate GST</button>
<div class="result" id="gstResult"></div>
</div>

<div class="card">
<h2>EMI Calculator</h2>
<label>Loan Amount (₹)</label>
<input id="loan" type="number">
<label>Interest Rate (% yearly)</label>
<input id="interest" type="number">
<label>Tenure (years)</label>
<input id="years" type="number">
<button onclick="emi()">Calculate EMI</button>
<div class="result" id="emiResult"></div>
</div>

<div class="card">
<h2>Discount Calculator</h2>
<label>Original Price (₹)</label>
<input id="price" type="number">
<label>Discount (%)</label>
<input id="discount" type="number">
<button onclick="discountCalc()">Calculate</button>
<div class="result" id="discountResult"></div>
</div>

<div class="card">
<h2>KM ↔ Miles Converter</h2>
<label>Value</label>
<input id="distance" type="number">
<select id="conversion">
<option value="km">Kilometers to Miles</option>
<option value="mile">Miles to Kilometers</option>
</select>
<button onclick="convert()">Convert</button>
<div class="result" id="distanceResult"></div>
</div>

<div class="card">
<h2>Simple Calculator</h2>
<label>First Number</label>
<input id="num1" type="number">
<label>Second Number</label>
<input id="num2" type="number">
<select id="operator">
<option value="+">Addition (+)</option>
<option value="-">Subtraction (-)</option>
<option value="*">Multiplication (×)</option>
<option value="/">Division (÷)</option>
</select>
<button onclick="calculator()">Calculate</button>
<div class="result" id="calcResult"></div>
</div>

</div>

<footer>© 2026 Tool Mitra<br>

<a href="privacy.html">Privacy Policy</a>
  
<a href="contact.html">Contact Us</a>
</footer>

<script>

function percentage(){
let p=Number(document.getElementById("percent").value);
let n=Number(document.getElementById("percentNum").value);
document.getElementById("percentResult").innerText=
isNaN(p)||isNaN(n)?"Enter both values":p+"% of "+n+" = "+(p*n/100);
}

function age(){
let d=document.getElementById("dob").value;
if(!d){document.getElementById("ageResult").innerText="Select your DOB";return}
let birth=new Date(d);
let today=new Date();
let y=today.getFullYear()-birth.getFullYear();
let m=today.getMonth()-birth.getMonth();
let day=today.getDate()-birth.getDate();
if(day<0){m--;day+=new Date(today.getFullYear(),today.getMonth(),0).getDate()}
if(m<0){y--;m+=12}
document.getElementById("ageResult").innerText=y+" years, "+m+" months, "+day+" days";
}

function bmi(){
let h=Number(document.getElementById("height").value);
let w=Number(document.getElementById("weight").value);
if(!h||!w){document.getElementById("bmiResult").innerText="Enter height and weight";return}
let b=w/((h/100)*(h/100));
document.getElementById("bmiResult").innerText="Your BMI is "+b.toFixed(1);
}

function gst(){
let a=Number(document.getElementById("gstAmount").value);
let r=Number(document.getElementById("gstRate").value);
if(!a||isNaN(r)){document.getElementById("gstResult").innerText="Enter amount and GST rate";return}
let g=a*r/100;
document.getElementById("gstResult").innerText="GST: ₹"+g.toFixed(2)+" | Total: ₹"+(a+g).toFixed(2);
}

function emi(){
let p=Number(document.getElementById("loan").value);
let r=Number(document.getElementById("interest").value)/12/100;
let n=Number(document.getElementById("years").value)*12;
if(!p||isNaN(r)||!n){document.getElementById("emiResult").innerText="Enter all values";return}
let e=r===0?p/n:p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
document.getElementById("emiResult").innerText="Monthly EMI: ₹"+e.toFixed(2);
}

function discountCalc(){
let p=Number(document.getElementById("price").value);
let d=Number(document.getElementById("discount").value);
if(!p||isNaN(d)){document.getElementById("discountResult").innerText="Enter both values";return}
let save=p*d/100;
document.getElementById("discountResult").innerText="You save ₹"+save.toFixed(2)+" | Final Price: ₹"+(p-save).toFixed(2);
}

function convert(){
let v=Number(document.getElementById("distance").value);
let type=document.getElementById("conversion").value;
if(isNaN(v)){document.getElementById("distanceResult").innerText="Enter a value";return}
if(type==="km")
document.getElementById("distanceResult").innerText=v+" km = "+(v*0.621371).toFixed(3)+" miles";
else
document.getElementById("distanceResult").innerText=v+" miles = "+(v*1.60934).toFixed(3)+" km";
}

function calculator(){
let a=Number(document.getElementById("num1").value);
let b=Number(document.getElementById("num2").value);
let op=document.getElementById("operator").value;
let ans;
if(op==="+")ans=a+b;
if(op==="-")ans=a-b;
if(op==="*")ans=a*b;
if(op==="/"){
if(b===0){document.getElementById("calcResult").innerText="Cannot divide by zero";return}
ans=a/b;
}
document.getElementById("calcResult").innerText="Answer: "+ans;
}

</script>

</body>
</html>
