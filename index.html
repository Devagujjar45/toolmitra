<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Tool Mitra - Free Online Tools</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f0fdf4;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
      min-height: 25px;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .tool-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    @media (max-width: 600px) {
      .tools {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Tool Mitra</h1>
  <p>Free & Simple Online Tools</p>
</header>

<div class="container">

  <!-- Percentage Calculator -->
  <div class="card">
    <h2>Percentage Calculator</h2>

    <label for="percentage">Percentage (%)</label>
    <input type="number" id="percentage" placeholder="Example: 20">

    <label for="number">Number</label>
    <input type="number" id="number" placeholder="Example: 500">

    <button onclick="calculatePercentage()">Calculate</button>

    <div class="result" id="percentageResult"></div>
  </div>


  <!-- Age Calculator -->
  <div class="card">
    <h2>Age Calculator</h2>

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob">

    <button onclick="calculateAge()">Calculate Age</button>

    <div class="result" id="ageResult"></div>
  </div>


  <!-- More Tools -->
  <h2>More Tools</h2>

  <div class="tools">
    <div class="tool-box">
      <h3>Percentage</h3>
      <p>Calculate percentages easily.</p>
    </div>

    <div class="tool-box">
      <h3>Age Calculator</h3>
      <p>Calculate your exact age.</p>
    </div>
  </div>

</div>

<footer>
  © 2026 Tool Mitra
</footer>


<script>

  // Percentage Calculator
  function calculatePercentage() {
    const percentage = parseFloat(
      document.getElementById("percentage").value
    );

    const number = parseFloat(
      document.getElementById("number").value
    );

    const result = document.getElementById("percentageResult");

    if (isNaN(percentage) || isNaN(number)) {
      result.innerText = "Please enter both values.";
      return;
    }

    const answer = (percentage / 100) * number;

    result.innerText =
      percentage + "% of " + number + " = " + answer;
  }


  // Age Calculator
  function calculateAge() {
    const dobInput = document.getElementById("dob").value;
    const result = document.getElementById("ageResult");

    if (!dobInput) {
      result.innerText = "Please select your date of birth.";
      return;
    }

    const parts = dobInput.split("-");

    const birthYear = Number(parts[0]);
    const birthMonth = Number(parts[1]);
    const birthDay = Number(parts[2]);

    const today = new Date();

    let years = today.getFullYear() - birthYear;
    let months = (today.getMonth() + 1) - birthMonth;
    let days = today.getDate() - birthDay;

    if (days < 0) {
      months--;

      const previousMonthDays =
        new Date(today.getFullYear(), today.getMonth(), 0).getDate();

      days += previousMonthDays;
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    result.innerText =
      "Your age is " +
      years + " years, " +
      months + " months and " +
      days + " days.";
  }

</script>

</body>
</html>
