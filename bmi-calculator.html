<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMI Calculator - Tool Mitra</title>

<meta name="description" content="Calculate your BMI instantly using the free Tool Mitra BMI Calculator.">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#172554 0,transparent 30%),
    radial-gradient(circle at 90% 20%,#312e81 0,transparent 28%),
    #070b16;
  color:#f8fafc;
}

header{
  text-align:center;
  padding:35px 15px;
}

.logo{
  font-size:32px;
  font-weight:900;
  background:linear-gradient(90deg,#fff,#818cf8,#22d3ee);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

header a{
  color:#67e8f9;
  text-decoration:none;
}

.container{
  max-width:600px;
  margin:20px auto;
  padding:15px;
}

.card{
  background:rgba(15,23,42,.85);
  border:1px solid #1e293b;
  border-radius:22px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.icon{
  text-align:center;
  font-size:55px;
}

h1{
  text-align:center;
  margin:10px 0;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  line-height:1.5;
}

label{
  display:block;
  margin-top:22px;
  margin-bottom:8px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #334155;
  background:#0b1220;
  color:white;
  font-size:17px;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:translateY(-2px);
}

.result{
  margin-top:20px;
  padding:20px;
  border-radius:15px;
  background:rgba(30,41,59,.8);
  text-align:center;
  line-height:1.7;
}

footer{
  text-align:center;
  padding:35px 15px;
  color:#64748b;
}

footer a{
  color:#67e8f9;
  text-decoration:none;
  margin:0 5px;
}
</style>
</head>

<body>

<header>

  <div class="logo">Tool Mitra</div>

  <br>

  <a href="tools.html">← Back to All Tools</a>

</header>

<div class="container">

  <div class="card">

    <div class="icon">⚖️</div>

    <h1>BMI Calculator</h1>

    <p class="subtitle">
      Calculate your Body Mass Index using your height and weight.
    </p>

    <label>Height (cm)</label>

    <input
      type="number"
      id="height"
      placeholder="Example: 170"
      min="1"
    >

    <label>Weight (kg)</label>

    <input
      type="number"
      id="weight"
      placeholder="Example: 65"
      min="1"
    >

    <button onclick="calculateBMI()">
      ⚡ Calculate BMI
    </button>

    <div class="result" id="result">
      Enter your height and weight above.
    </div>

  </div>

</div>

<footer>

  © 2026 Tool Mitra<br><br>

  <a href="index.html">Home</a> |
  <a href="tools.html">All Tools</a> |
  <a href="privacy.html">Privacy</a> |
  <a href="contact.html">Contact</a>

</footer>

<script>
function calculateBMI(){

  let height=Number(
    document.getElementById("height").value
  );

  let weight=Number(
    document.getElementById("weight").value
  );

  let result=document.getElementById("result");

  if(!height || !weight || height<=0 || weight<=0){

    result.innerHTML=
      "⚠️ Please enter a valid height and weight.";

    return;
  }

  let heightMeters=height/100;

  let bmi=
    weight/(heightMeters*heightMeters);

  bmi=Number(bmi.toFixed(1));

  let category="";

  if(bmi<18.5){

    category="Underweight";

  }else if(bmi<25){

    category="Normal range";

  }else if(bmi<30){

    category="Overweight";

  }else{

    category="Obesity";

  }

  result.innerHTML=
    "<div style='font-size:25px;font-weight:bold;'>"+
    "⚖️ Your BMI"+
    "</div><br>"+
    "<strong style='font-size:32px;'>"+
    bmi+
    "</strong><br><br>"+
    "<strong>Category: "+
    category+
    "</strong><br><br>"+
    "Height: "+height+" cm<br>"+
    "Weight: "+weight+" kg";
}
</script>

</body>
</html>
