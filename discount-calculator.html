<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discount Calculator - Tool Mitra</title>
<meta name="description" content="Free online Discount Calculator. Calculate discount amount and final price instantly.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#070b14;
  color:#fff;
  min-height:100vh;
}

header{
  padding:18px;
  text-align:center;
  border-bottom:1px solid #20283a;
}

header a{
  color:#00eaff;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:500px;
  margin:45px auto;
  padding:20px;
}

.card{
  background:#101827;
  border:1px solid #263247;
  border-radius:20px;
  padding:28px;
  box-shadow:0 0 30px rgba(0,234,255,.08);
}

h1{
  text-align:center;
  color:#00eaff;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#9ba7ba;
  margin-bottom:28px;
}

label{
  display:block;
  margin:15px 0 8px;
  color:#dce4f2;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #34415a;
  background:#080d18;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#00eaff;
}

button{
  width:100%;
  margin-top:24px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#00eaff;
  color:#001018;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.result{
  margin-top:25px;
  padding:20px;
  background:#080d18;
  border-radius:14px;
  border:1px solid #263247;
  line-height:2;
}

.result strong{
  color:#00eaff;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#9ba7ba;
  text-decoration:none;
}

.back:hover{
  color:#00eaff;
}

footer{
  text-align:center;
  padding:30px 15px;
  color:#667085;
}
</style>
</head>

<body>

<header>
  <a href="index.html">⚡ Tool Mitra</a>
</header>

<div class="container">

<a href="tools.html" class="back">← Back to All Tools</a>

<div class="card">

<h1>Discount Calculator</h1>

<p class="subtitle">
Calculate discount and final price instantly.
</p>

<label>Original Price</label>
<input type="number" id="price" placeholder="Enter original price">

<label>Discount (%)</label>
<input type="number" id="discount" placeholder="Enter discount percentage">

<button onclick="calculateDiscount()">Calculate Discount</button>

<div class="result" id="result">
Enter values and click Calculate.
</div>

</div>
</div>

<footer>
© 2026 Tool Mitra
</footer>

<script>
function calculateDiscount(){

  let price = parseFloat(document.getElementById("price").value);
  let discount = parseFloat(document.getElementById("discount").value);

  if(isNaN(price) || isNaN(discount)){
    document.getElementById("result").innerHTML =
      "Please enter valid values.";
    return;
  }

  if(price < 0 || discount < 0){
    document.getElementById("result").innerHTML =
      "Please enter positive values.";
    return;
  }

  let discountAmount = price * discount / 100;
  let finalPrice = price - discountAmount;

  document.getElementById("result").innerHTML =
    "<strong>Discount Amount:</strong> ₹" + discountAmount.toFixed(2) +
    "<br><strong>Final Price:</strong> ₹" + finalPrice.toFixed(2);
}
</script>

</body>
</html>
